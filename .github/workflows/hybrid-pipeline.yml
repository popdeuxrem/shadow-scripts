name: Hybrid Build & Deploy Pipeline (GitHub Pages)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:   # enables manual trigger

concurrency:
  group: hybrid-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

defaults:
  run:
    shell: bash

jobs:
  setup:
    name: Setup Environment
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.set-cache-key.outputs.CACHE_KEY }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Enable & Prep pnpm (corepack)
        run: |
          corepack enable
          corepack prepare pnpm@9.12.3 --activate

      - name: Set Cache Key
        id: set-cache-key
        run: echo "CACHE_KEY=$(echo $RUNNER_OS-pnpm-$(sha256sum pnpm-lock.yaml | cut -d' ' -f1))" >> $GITHUB_OUTPUT

      - name: Restore pnpm store cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            .pnpm-store
          key: ${{ steps.set-cache-key.outputs.CACHE_KEY }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

  build:
    name: Build Application & Artifacts
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore pnpm store cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            .pnpm-store
          key: ${{ needs.setup.outputs.cache-key }}

      - name: Install Dependencies (build)
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Make scripts executable
        run: chmod +x ./scripts/*.sh || true

      - name: Run Build
        run: |
          set -euo pipefail
          export TERM=xterm-256color
          ./scripts/build-all.sh

      - name: Generate Manifests & Loader
        run: |
          node scripts/gen-manifest.js
          node scripts/gen-index-loader.js
          node scripts/gen-catalog.js

      - name: Generate QR Codes
        if: ${{ always() }}
        run: |
          if [ -f ./scripts/gen-qrcodes.js ]; then
            node scripts/gen-qrcodes.js --output apps/loader/public/qrcodes
          else
            echo "gen-qrcodes.js not found, skipping"
          fi

      - name: Validate Pages Output
        run: |
          if [ ! -d "apps/loader/public" ]; then
            echo "ERROR: apps/loader/public missing; build may have failed" && exit 1
          fi
          echo "Pages directory present: $(du -sh apps/loader/public || true)"

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/loader/public

  test:
    name: Run Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.12.3 --activate
          pnpm install --frozen-lockfile
      - name: Run Tests
        run: |
          pnpm lint || (echo "Lint errors" && exit 1)
          pnpm test || (echo "Tests failed" && exit 1)

  deploy:
    name: Deploy to GitHub Pages
    needs: [build, test]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      - name: Show Published URL
        run: echo "Pages deployed. Check repository settings or Actions UI for environment URL."

    notify:
    name: Send Discord Notifications
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Prepare Notification Payload
        id: payload
        run: |
          cat <<EOF > payload.json
          {
            "text": "⚡ Hybrid Build & Deploy finished",
            "repo": "${{ github.repository }}",
            "commit": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "workflow": "${{ github.workflow }}",
            "status": "${{ job.status || 'unknown' }}"
          }
          EOF

      - name: Send Discord Notification
        run: |
          if [ -n "${DISCORD_WEBHOOK}" ]; then
            curl -s -H "Content-Type: application/json" -d @payload.json "$DISCORD_WEBHOOK" || echo "Discord notify failed"
          else
            echo "No DISCORD_WEBHOOK secret configured; skipping notifications"
          fi
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}