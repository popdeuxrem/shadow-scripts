name: ⚡ Hybrid Build & Deploy Pipeline ⚡

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hybrid-build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.x
  PNPM_VERSION: 9.12.3

permissions:
  contents: write
  pages: write
  id-token: write

defaults:
  run:
    shell: bash

jobs:
  setup:
    name: 🔧 Setup Environment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore pnpm cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            .pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Dependencies
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
          pnpm install --frozen-lockfile --prefer-offline || pnpm install --no-frozen-lockfile --prefer-offline

  generate:
    name: ⚡ Generate All Configs
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gen-all.js
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
          node scripts/gen-all.js --outdir=apps/loader/public/configs

      - name: Upload Pipeline Report
        uses: actions/upload-artifact@v3
        with:
          name: pipeline-report
          path: apps/loader/public/configs/pipeline-report.json

      - name: Validate Public Configs
        run: |
          if [ ! -d "apps/loader/public/configs" ]; then
            echo "ERROR: configs missing; generation may have failed" && exit 1
          fi
          echo "Configs directory present: $(du -sh apps/loader/public/configs)"

  test:
    name: 🧪 Run Tests
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
          pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile

      - name: Run Tests & Lint
        run: |
          pnpm lint || (echo "Lint errors" && exit 1)
          pnpm test || (echo "Tests failed" && exit 1)

  deploy:
    name: 🌐 Deploy to GitHub Pages
    needs: [generate, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      - name: Show published URL
        run: echo "Pages deployed. Visit the repository settings or Actions environment URL."

  notify:
    name: 📢 Send Discord Notification
    needs: [deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Prepare Notification Payload
        id: payload
        run: |
          cat <<EOF > payload.json
          {
            "text": "⚡ Hybrid Build & Deploy finished",
            "repo": "${{ github.repository }}",
            "commit": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "workflow": "${{ github.workflow }}",
            "status": "${{ job.status || 'unknown' }}"
          }
          EOF

      - name: Send Discord Notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -n "${DISCORD_WEBHOOK}" ]; then
            curl -s -H "Content-Type: application/json" -d @payload.json "$DISCORD_WEBHOOK" || echo "Discord notify failed"
          else
            echo "No DISCORD_WEBHOOK secret configured; skipping notifications"

  cleanup:
    name: 🧹 Cleanup
    needs: notify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    if: always()
    steps:
      - name: Prune pnpm cache
        run: pnpm store prune || true