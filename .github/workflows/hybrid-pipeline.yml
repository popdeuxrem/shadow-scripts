name: Shadow-Scripts Hybrid Build & Deploy Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hybrid-build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20.x
  PNPM_VERSION: 9.12.3
  CACHE_KEY: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}

permissions:
  contents: write
  pages: write
  id-token: write

defaults:
  run:
    shell: bash

jobs:
  setup:
    name: Setup Environment
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ env.CACHE_KEY }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable & Prep pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: Restore pnpm Store Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            .pnpm-store
          key: ${{ env.CACHE_KEY }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

  build:
    name: Build Cyberpunk Artifacts
    needs: setup
    runs-on: ubuntu-latest
    outputs:
      pages-artifact: apps/loader/public
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore pnpm Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            .pnpm-store
          key: ${{ env.CACHE_KEY }}

      - name: Make Scripts Executable
        run: chmod +x ./scripts/*.sh || true

      - name: Run Full Build
        run: |
          set -euo pipefail
          export TERM=xterm-256color
          ./scripts/build-all.sh --force-rebuild

      - name: Generate Loader & Dashboard
        run: |
          node scripts/gen-manifest.js
          node scripts/gen-index-loader.js
          node scripts/gen-catalog.js

      - name: Generate QR Codes
        run: |
          node scripts/gen-qrcodes.js --inline --ci

      - name: Validate Output
        run: |
          if [ ! -d "apps/loader/public" ]; then
            echo "ERROR: apps/loader/public missing; build failed" && exit 1
          fi
          echo "✅ Pages directory verified: $(du -sh apps/loader/public)"

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/loader/public

  test:
    name: Lint & Unit Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
          pnpm install --frozen-lockfile
      - run: |
          pnpm lint || (echo "Lint failed" && exit 1)
          pnpm test || (echo "Tests failed" && exit 1)

  deploy:
    name: Deploy to GitHub Pages
    needs: [build, test]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy Pages
        uses: actions/deploy-pages@v4
      - name: Show Published URL
        run: echo "Pages deployed. Check repository settings for URL."

  notify:
    name: Discord / Slack Notifications
    needs: [deploy]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Prepare Notification Payload
        id: payload
        run: |
          cat <<EOF > payload.json
          {
            "text": "⚡ Shadow-Scripts Hybrid Build Finished",
            "repo": "${{ github.repository }}",
            "commit": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "workflow": "${{ github.workflow }}",
            "status": "${{ job.status || 'unknown' }}"
          }
          EOF

      - name: Send Discord Alert (optional)
        if: ${{ secrets.DISCORD_WEBHOOK != '' }}
        run: |
          curl -s -H "Content-Type: application/json" -d @payload.json "${{ secrets.DISCORD_WEBHOOK }}" || echo "⚠️ Discord notify failed"
      - name: Fallback Logging
        if: ${{ secrets.DISCORD_WEBHOOK == '' }}
        run: echo "No DISCORD_WEBHOOK configured; skipping notification"

  cleanup:
    name: Cleanup Cache
    needs: notify
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: pnpm store prune || true
