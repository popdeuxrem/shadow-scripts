name: ⚡ Hybrid Build & Deploy Pipeline ⚡

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hybrid-build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.x
  PNPM_VERSION: 9.12.3
  BUILD_CACHE_DIR: .build-cache

permissions:
  contents: write
  pages: write
  id-token: write

defaults:
  run:
    shell: bash

jobs:
  setup:
    name: 🔧 Setup Environment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore pnpm cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            .pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Dependencies
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
          pnpm -v
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile --prefer-offline
          else
            pnpm install --no-frozen-lockfile --prefer-offline
          fi

  build:
    name: 🚀 Build & Generate Artifacts
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
    outputs:
      pages-artifact: apps/loader/public
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore pnpm cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            .pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Restore Build Cache
        uses: actions/cache@v4
        with:
          path: ${{ env.BUILD_CACHE_DIR }}
          key: ${{ runner.os }}-build-cache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-build-cache-

      - name: Make scripts executable
        run: chmod +x ./scripts/*.sh || true

      - name: Detect Changed Payloads
        id: changed
        run: |
          mkdir -p ${{ env.BUILD_CACHE_DIR }}/changed
          PAYLOADS=$(git diff --name-only HEAD~1 HEAD apps/loader/public/obfuscated || true)
          echo "Changed payloads:"
          echo "$PAYLOADS"
          for p in $PAYLOADS; do
            if [[ $p == *.js ]]; then
              cp "$p" "${{ env.BUILD_CACHE_DIR }}/changed/"
            fi
          done
          echo "changed_payloads=$(ls -1 ${{ env.BUILD_CACHE_DIR }}/changed | wc -l)" >> $GITHUB_OUTPUT

      - name: Incremental Obfuscation
        run: |
          if [ "${{ steps.changed.outputs.changed_payloads }}" -gt 0 ]; then
            echo "Re-obfuscating only changed payloads..."
            node scripts/obfuscate-all.js --profile medium --input-dir ${{ env.BUILD_CACHE_DIR }}/changed --output-dir apps/loader/public/obfuscated
          else
            echo "No payloads changed; skipping obfuscation"
          fi

      - name: Generate Proxy Configs
        run: |
          node scripts/gen-shadowrocket.js
          node scripts/gen-loon.js
          node scripts/gen-stash.js
          node scripts/gen-mobileconfig.js
          node scripts/gen-tunna.js
          node scripts/gen-egern.js

      - name: Generate Manifests & Loader
        run: |
          node scripts/gen-manifest.js
          node scripts/gen-index-loader.js
          node scripts/gen-catalog.js

      - name: Generate QR Codes
        run: |
          if [ -f ./scripts/gen-qrcodes.js ]; then
            node scripts/gen-qrcodes.js --output apps/loader/public/qrcodes --version "${{ github.ref_name || github.sha }}"
          else
            echo "gen-qrcodes.js not found, skipping"
          fi

      - name: Validate Configs & Obfuscated Payloads
        run: node scripts/validate-configs.js

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/loader/public

      - name: Save Build Cache
        uses: actions/cache@v4
        with:
          path: ${{ env.BUILD_CACHE_DIR }}
          key: ${{ runner.os }}-build-cache-${{ github.sha }}

  test:
    name: 🧪 Run Tests & Lint
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
          pnpm -v
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi
      - name: Run Lint & Tests
        run: |
          pnpm lint || (echo "Lint errors" && exit 1)
          pnpm test || (echo "Tests failed" && exit 1)

  deploy:
    name: 🌐 Deploy to GitHub Pages
    needs: [build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
      - name: Show published URL
        run: echo "Pages deployed. Visit repository settings or Actions environment URL."

  notify:
    name: 📢 Send Discord Notification
    needs: [deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Prepare Notification Payload
        id: payload
        run: |
          cat <<EOF > payload.json
          {
            "text": "⚡ Hybrid Build & Deploy finished",
            "repo": "${{ github.repository }}",
            "commit": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "workflow": "${{ github.workflow }}",
            "status": "${{ job.status || 'unknown' }}"
          }
          EOF

      - name: Send Discord Notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -n "${DISCORD_WEBHOOK}" ]; then
            curl -s -H "Content-Type: application/json" -d @payload.json "$DISCORD_WEBHOOK" || echo "Discord notify failed"
          else
            echo "No DISCORD_WEBHOOK secret configured; skipping notifications"

  cleanup:
    name: 🧹 Cleanup
    needs: notify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    if: always()
    steps:
      - name: Prune pnpm cache
        run: pnpm store prune || true