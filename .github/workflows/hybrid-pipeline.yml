name: ⚡ Hybrid Build & Deploy Pipeline ⚡

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hybrid-build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20.x
  PNPM_VERSION: 9.12.3
  CACHE_KEY: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}

permissions:
  contents: write
  pages: write
  id-token: write

defaults:
  run:
    shell: bash

jobs:
  setup:
    name: 🔧 Setup Environment
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ env.CACHE_KEY }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: Restore pnpm cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            .pnpm-store
          key: ${{ env.CACHE_KEY }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

  build:
    name: 🚀 Build Application & Artifacts
    needs: setup
    runs-on: ubuntu-latest
    outputs:
      pages-artifact: apps/loader/public
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore pnpm cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            .pnpm-store
          key: ${{ env.CACHE_KEY }}

      - name: Install dependencies (build)
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Make scripts executable
        run: chmod +x ./scripts/*.sh || true

      - name: Run Full Build Pipeline
        run: |
          set -euo pipefail
          export TERM=xterm-256color
          ./scripts/build-all.sh

      - name: Generate Manifests & Loader
        run: |
          node scripts/gen-manifest.js || true
          node scripts/gen-index-loader.js || true
          node scripts/gen-catalog.js || true

      - name: Generate QR Codes
        run: |
          if [ -f ./scripts/gen-qrcodes.js ]; then
            node scripts/gen-qrcodes.js --output apps/loader/public/qrcodes --version "${{ github.ref_name || github.sha }}"
          else
            echo "gen-qrcodes.js not found, skipping"
          fi

      - name: Validate pages output
        run: |
          if [ ! -d "apps/loader/public" ]; then
            echo "ERROR: apps/loader/public missing; build may have failed" && exit 1
          fi
          echo "Pages directory present: $(du -sh apps/loader/public || true)"

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/loader/public

  test:
    name: 🧪 Run Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
          pnpm install --frozen-lockfile
      - name: Run Tests & Lint
        run: |
          pnpm lint || (echo "Lint errors" && exit 1)
          pnpm test || (echo "Tests failed" && exit 1)

  deploy:
    name: 🌐 Deploy to GitHub Pages
    needs: [build, test]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Show published URL
        run: |
          echo "Pages deployed. Visit the Pages site from repository settings or Actions environment URL."

  notify:
    name: 📢 Send Discord Notification
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Prepare Notification Payload
        id: payload
        run: |
          cat <<EOF > payload.json
          {
            "text": "⚡ Hybrid Build & Deploy finished",
            "repo": "${{ github.repository }}",
            "commit": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "workflow": "${{ github.workflow }}",
            "status": "${{ job.status || 'unknown' }}"
          }
          EOF

      - name: Send Discord Notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -n "${DISCORD_WEBHOOK}" ]; then
            curl -s -H "Content-Type: application/json" -d @payload.json "$DISCORD_WEBHOOK" || echo "Discord notify failed"
          else
            echo "No DISCORD_WEBHOOK secret configured; skipping notifications"
          fi

  cleanup:
    name: 🧹 Cleanup
    needs: notify
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Prune pnpm cache
        run: pnpm store prune || true